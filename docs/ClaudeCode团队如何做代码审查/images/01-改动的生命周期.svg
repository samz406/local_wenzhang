<text x="32" y="14" font-size="11" font-weight="500" class="mono" style="fill:#4c4b45">创建 PR 之前</text>
<text x="32" y="38" font-size="14" font-weight="500" style="fill:#141413">验证工作结果</text>
<text x="277" y="38" font-size="13" style="fill:#4c4b45">Claude 运行测试、构建和 lint；另一个智能体</text>
<text x="277" y="55" font-size="13" style="fill:#4c4b45">在全新上下文中审查代码差异</text>
<text x="32" y="95" font-size="11" font-weight="500" class="mono" style="fill:#4c4b45">每一个 PR</text>
<text x="32" y="119" font-size="14" font-weight="500" style="fill:#141413">必需的 CI 检查</text>
<text x="277" y="119" font-size="13" style="fill:#4c4b45">lint、类型、跨平台测试、构建及打包；失败时</text>
<text x="277" y="136" font-size="13" style="fill:#4c4b45">阻止合并</text>
<text x="32" y="166" font-size="14" font-weight="500" style="fill:#141413">Claude 代码审查</text>
<text x="277" y="166" font-size="13" style="fill:#4c4b45">智能体并行查错，验证智能体对问题投票，</text>
<text x="277" y="183" font-size="13" style="fill:#4c4b45">保留下来的问题按严重程度排序</text>
<text x="32" y="213" font-size="14" font-weight="500" style="fill:#141413">安全审查</text>
<text x="277" y="213" font-size="13" style="fill:#4c4b45">独立审查；代码审查或安全审查中未解决的问题</text>
<text x="277" y="230" font-size="13" style="fill:#4c4b45">都会阻止合并</text>
<text x="32" y="260" font-size="14" font-weight="500" style="fill:#141413">按风险分级审批</text>
<text x="277" y="260" font-size="13" style="fill:#4c4b45">分类器决定无需人工、1 人或 2 人审批；部分路径</text>
<text x="277" y="277" font-size="13" style="fill:#4c4b45">始终需要人工审批</text>
<text x="32" y="317" font-size="11" font-weight="500" class="mono" style="fill:#4c4b45">合并时</text>
<text x="32" y="341" font-size="14" font-weight="500" style="fill:#141413">合并队列</text>
<text x="277" y="341" font-size="13" style="fill:#4c4b45">将改动应用到最新 main，再次运行检查</text>
<text x="32" y="381" font-size="11" font-weight="500" class="mono" style="fill:#4c4b45">合并后</text>
<text x="32" y="405" font-size="14" font-weight="500" style="fill:#141413">通过功能开关控制，先供内部使用</text>
<text x="277" y="405" font-size="13" style="fill:#4c4b45">Anthropic 员工先使用，再向所有用户发布</text>
<text x="32" y="435" font-size="14" font-weight="500" style="fill:#141413">逐步发布</text>
<text x="277" y="435" font-size="13" style="fill:#4c4b45">先进入 latest 渠道，stable 渠道随后跟进</text>
<text x="32" y="465" font-size="14" font-weight="500" style="fill:#141413">监测、向前修复或回滚</text>
<text x="277" y="465" font-size="13" style="fill:#4c4b45">作者和值班人员监测；快速关闭功能开关，</text>
<text x="277" y="482" font-size="13" style="fill:#4c4b45">有问题的构建予以回滚</text>
