  <text class="strong" x="125" y="628">⚙ 后台运营</text><text class="small" x="155" y="659">完成排版、添加到 CMS、排好未来 4 周的发布计划，并更新追踪表。</text><text class="small" x="155" y="686">✅ 运营状态 → 查看检查清单</text>
  <text class="body" x="100" y="731">所有内容都已准备好，等待你的审核。不再需要额外找写手；草稿、候选清单和运营步骤</text><text class="body" x="100" y="760">都在等你修改和批准。</text>
