  <circle cx="55" cy="205" r="30" fill="#c7e4ef"/><text x="55" y="212" text-anchor="middle" font-size="20" font-weight="700">R</text><text class="name" x="100" y="192">Rahul</text><text class="meta" x="175" y="192">10:14</text>
  <text class="body" x="100" y="226"><tspan fill="#1386bd" font-weight="700">@Viktor</tspan><tspan> 请接管本周的新闻简报。</tspan></text><text class="body" x="100" y="260">完成研究、整理候选主题、按照我们的表达风格起草 4 篇稿件，并处理后台运营工作</text><text class="body" x="100" y="290">（排版、定时发布和效果追踪）。把所有结果发到这里，等待我审核和批准。</text>
  <rect x="26" y="335" width="60" height="60" rx="12" fill="#7650f3"/><text x="56" y="376" text-anchor="middle" font-size="32" font-weight="700" fill="#fff">V</text><text class="name" x="100" y="352">Viktor</text><text class="meta" x="185" y="352">应用 · 10:31</text><text class="strong" x="100" y="388">全部完成，整套工作流已经跑完。交付内容如下：</text>
  <text class="strong" x="125" y="432">🔎 每周研究</text><text class="small" x="155" y="463">研究本周主题，从已有信息源提取洞见，并整理出一份附有理由的候选清单。</text><text class="small" x="155" y="490">📝 5 个选题 → 查看候选清单</text>
