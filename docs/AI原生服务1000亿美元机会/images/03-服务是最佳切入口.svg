<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="t d">
  <title id="t">服务是最佳切入口</title><desc id="d">从亲手服务客户、发现痛点、写规则手册，到产品化与可选的软件化</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6" fill="none" stroke="#222" stroke-width="1.8"/></marker></defs>
  <style>.tx{font-family:'Noto Sans SC',sans-serif;fill:#222}.h{font-size:52px;font-weight:800}.b{font-size:31px}.s{font-size:24px}.box{fill:#fff;stroke:#222;stroke-width:4}.y{fill:#ffe96b}.green{fill:#31915d}</style>
  <rect width="1400" height="900" fill="#fbfaf5"/><text class="tx h" x="700" y="90" text-anchor="middle">服务，是最好的切入口</text><rect class="y" x="420" y="120" width="560" height="70" rx="12"/><text class="tx b" x="700" y="168" text-anchor="middle">客户付钱让你弄清楚该做什么</text>
  <g class="tx b" text-anchor="middle"><rect class="y" x="35" y="275" width="220" height="60" rx="10"/><text x="145" y="316">亲手做服务</text><rect class="y" x="320" y="275" width="220" height="60" rx="10"/><text x="430" y="316">找到真痛点</text><rect class="y" x="605" y="275" width="220" height="60" rx="10"/><text x="715" y="316">写规则手册</text><rect class="y" x="890" y="275" width="220" height="60" rx="10"/><text x="1000" y="316">完成产品化</text><rect class="y" x="1175" y="275" width="190" height="60" rx="10"/><text x="1270" y="316">软件化</text></g>
  <g class="box"><circle cx="145" cy="470" r="70"/><rect x="75" y="540" width="140" height="100" rx="30"/><rect x="350" y="415" width="160" height="150" rx="30"/><rect x="640" y="400" width="150" height="190" rx="12"/><rect x="910" y="405" width="180" height="150" rx="14"/><path d="M1200 535Q1170 460 1240 440Q1280 355 1350 445Q1415 460 1370 535Z"/></g>
  <g class="tx s" text-anchor="middle"><text x="145" y="705">先服务 5 位客户</text><text x="430" y="610">看清哪里会出错</text><text x="715" y="635"><tspan x="715">把“正确”是什么</tspan><tspan x="715" dy="34">沉淀下来</tspan></text><text x="1000" y="610"><tspan x="1000">表单 + 仪表盘</tspan><tspan x="1000" dy="34">+ 工作流</tspan></text><text x="1270" y="610">按需选择</text></g>
  <g stroke="#222" stroke-width="4" marker-end="url(#a)"><path d="M235 500H330"/><path d="M530 500H625"/><path d="M805 500H900"/><path d="M1100 500H1190"/></g>
  <path d="M420 800H980" stroke="#31915d" stroke-width="7"/><text class="tx b green" x="700" y="780" text-anchor="middle">路线图由客户出资验证</text>
</svg>
