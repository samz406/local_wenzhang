<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1448 1086" role="img" aria-labelledby="t d">
  <title id="t">为什么 AI 原生服务会在现在出现</title><desc id="d">模型能力、运行成本和服务市场三个条件同时成熟</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6" fill="none" stroke="#222" stroke-width="1.8"/></marker></defs>
  <style>.tx{font-family:'Noto Sans SC',sans-serif;fill:#222}.h{font-size:55px;font-weight:800}.b{font-size:34px}.s{font-size:27px}.box{fill:#fff;stroke:#222;stroke-width:4}.y{fill:#ffe96b}.green{fill:#31915d}</style>
  <rect width="1448" height="1086" fill="#fbfaf5"/><text class="tx h" x="724" y="95" text-anchor="middle">为什么偏偏是现在？</text><rect class="y" x="470" y="120" width="510" height="70" rx="12"/><text class="tx b" x="725" y="168" text-anchor="middle">三个条件同时成熟</text>
  <path d="M485 235V795M965 235V795" stroke="#aaa" stroke-width="3"/>
  <g class="tx h" text-anchor="middle"><circle class="box" cx="245" cy="255" r="42"/><text x="245" y="274">1</text><circle class="box" cx="725" cy="255" r="42"/><text x="725" y="274">2</text><circle class="box" cx="1205" cy="255" r="42"/><text x="1205" y="274">3</text></g>
  <rect class="y" x="85" y="335" width="320" height="110" rx="14"/><text class="tx b" x="245" y="380" text-anchor="middle"><tspan x="245">模型终于</tspan><tspan x="245" dy="42">足够好用</tspan></text><rect class="box" x="90" y="535" width="150" height="190"/><text class="tx s" x="165" y="625" text-anchor="middle">粗糙</text><text class="tx s" x="165" y="663" text-anchor="middle">草稿</text><path d="M260 630H340" stroke="#222" stroke-width="4" marker-end="url(#a)"/><rect class="box" x="350" y="535" width="95" height="190"/><text class="tx s" x="397" y="625" text-anchor="middle">可交付</text><text class="tx s" x="397" y="663" text-anchor="middle">成稿</text>
  <rect class="y" x="565" y="335" width="320" height="110" rx="14"/><text class="tx b" x="725" y="380" text-anchor="middle"><tspan x="725">运行成本</tspan><tspan x="725" dy="42">大幅下降</tspan></text><g fill="#fff" stroke="#222" stroke-width="4"><ellipse cx="620" cy="585" rx="70" ry="25"/><ellipse cx="620" cy="625" rx="70" ry="25"/><ellipse cx="620" cy="665" rx="70" ry="25"/><ellipse cx="820" cy="665" rx="35" ry="15"/></g><path d="M700 625H770" stroke="#222" stroke-width="4" marker-end="url(#a)"/><text class="tx s" x="620" y="755" text-anchor="middle">美元</text><text class="tx s" x="820" y="755" text-anchor="middle">美分</text>
  <rect class="y" x="1025" y="335" width="360" height="110" rx="14"/><text class="tx b" x="1205" y="380" text-anchor="middle"><tspan x="1205">4.6 万亿美元</tspan><tspan x="1205" dy="42">服务市场</tspan></text><circle class="box" cx="1205" cy="625" r="105"/><path d="M1110 595Q1200 540 1300 600M1140 680Q1200 635 1270 690" fill="none" stroke="#31915d" stroke-width="10"/><text class="tx s" x="1205" y="780" text-anchor="middle">规模远大于软件市场</text>
  <path d="M180 915H1268" stroke="#31915d" stroke-width="8"/><text class="tx b green" x="724" y="890" text-anchor="middle">更强的模型正在放大服务生意，而不是削弱它</text>
</svg>
