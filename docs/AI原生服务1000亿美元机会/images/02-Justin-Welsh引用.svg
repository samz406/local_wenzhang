<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-labelledby="t d">
  <title id="t">Justin Welsh 关于小而美生意的观点</title><desc id="d">最幸福的人往往在经营规模更小、利润率更高、更具个人色彩的生意</desc>
  <style>.tx{font-family:'Noto Sans SC',sans-serif;fill:#101828}.h{font-size:34px;font-weight:800}.b{font-size:31px}.s{font-size:24px;fill:#65758b}</style>
  <rect width="900" height="600" rx="28" fill="#fff" stroke="#d0d7e2" stroke-width="3"/><circle cx="85" cy="85" r="52" fill="#dfe7ee"/><text class="tx h" x="85" y="97" text-anchor="middle">JW</text><text class="tx h" x="160" y="77">Justin Welsh</text><text class="tx s" x="160" y="115">@thejustinwelsh</text><text class="tx h" x="825" y="90" text-anchor="middle">𝕏</text>
  <text class="tx b" x="55" y="205"><tspan x="55">我认识的那些最幸福的人，正在经营规模更小、</tspan><tspan x="55" dy="50">利润率更高，也更具个人色彩的生意。</tspan><tspan x="55" dy="90">结果是：他们工作得更少，赚得不少，</tspan><tspan x="55" dy="50">而且真正活在当下。</tspan></text>
  <text class="tx s" x="55" y="475">2026 年 9 月 11 日 · 12:02</text><path d="M55 510H845" stroke="#d0d7e2" stroke-width="2"/><text class="tx s" x="55" y="560">43 次转发　854 次喜欢</text>
