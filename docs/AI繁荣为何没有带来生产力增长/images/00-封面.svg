<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640" role="img" aria-labelledby="title desc">
  <title id="title">AI 投资回报随时间与投入先降后升</title>
  <desc id="desc">从投入、建设与学习到获得回报的曲线，以及不断增加的模型用量与待确认的投资回报。</desc>
  <defs>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a39ff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#6f24b3" stop-opacity="0.06"/>
    </linearGradient>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M 80 0 L 0 0 0 80" fill="none" stroke="#343039" stroke-width="1" opacity="0.32"/>
    </pattern>
    <style>
      text{font-family:'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#f4f0f8}
      .small{font-size:22px}.label{font-size:25px}.brand{font-family:serif;font-size:23px;letter-spacing:7px}
    </style>
  </defs>
  <rect width="1600" height="640" fill="#111114"/>
  <rect width="1600" height="640" fill="url(#grid)"/>
  <line x1="0" y1="65" x2="1320" y2="65" stroke="#5f5b66"/>
  <line x1="1320" y1="0" x2="1320" y2="640" stroke="#5f5b66"/>
  <text x="1380" y="70" class="brand">与我共学</text>

  <line x1="120" y1="510" x2="900" y2="510" stroke="#9a39ff" stroke-width="3"/>
  <polygon points="900,510 884,503 884,517" fill="#9a39ff"/>
  <line x1="120" y1="510" x2="120" y2="175" stroke="#9a39ff" stroke-width="3"/>
  <polygon points="120,175 113,191 127,191" fill="#9a39ff"/>
  <line x1="120" y1="430" x2="900" y2="430" stroke="#66606b" stroke-dasharray="4 5" opacity="0.65"/>
  <line x1="320" y1="185" x2="320" y2="510" stroke="#66606b" stroke-dasharray="4 5" opacity="0.65"/>
  <line x1="580" y1="185" x2="580" y2="510" stroke="#66606b" stroke-dasharray="4 5" opacity="0.65"/>
  <path d="M120,430 C235,430 260,428 320,472 C380,520 470,510 530,475 C635,410 730,360 900,185 L900,510 L120,510 Z" fill="url(#area)"/>
  <path d="M120,430 C235,430 260,428 320,472 C380,520 470,510 530,475 C635,410 730,360 900,185" fill="none" stroke="#a542ff" stroke-width="4"/>
  <text x="190" y="200" class="label">投入</text><path d="M220 213 l8 10 8-10" fill="#a542ff"/>
  <text x="395" y="200" class="label">建设与学习</text><path d="M478 213 l8 10 8-10" fill="#a542ff"/>
  <text x="670" y="200" class="label">获得回报</text><path d="M738 213 l8 10 8-10" fill="#a542ff"/>
  <text x="430" y="553" class="small">时间 / 投入</text>
  <text transform="translate(82 418) rotate(-90)" class="small">生产率 / 投资回报率</text>

  <path d="M930 340 H1020" stroke="#8d779c" stroke-width="2" stroke-dasharray="6 7"/>
  <polygon points="1020,340 1006,332 1006,348" fill="none" stroke="#8d779c" stroke-width="2"/>
  <g fill="none" stroke="#a542ff" stroke-width="2">
    <rect x="1065" y="182" width="115" height="21" rx="4" fill="#8e38da" fill-opacity="0.4"/><rect x="1065" y="212" width="115" height="21" rx="4" fill="#8731d2" fill-opacity="0.38"/>
    <rect x="1065" y="242" width="115" height="21" rx="4" fill="#7f2dc5" fill-opacity="0.34"/><rect x="1065" y="272" width="115" height="21" rx="4" fill="#7629b8" fill-opacity="0.30"/>
    <rect x="1065" y="302" width="115" height="21" rx="4" fill="#6d25aa" fill-opacity="0.27"/><rect x="1065" y="332" width="115" height="21" rx="4" fill="#64219d" fill-opacity="0.24"/>
    <rect x="1065" y="362" width="115" height="21" rx="4" fill="#5b1e90" fill-opacity="0.21"/><rect x="1065" y="392" width="115" height="21" rx="4" fill="#521a82" fill-opacity="0.18"/>
    <rect x="1065" y="422" width="115" height="21" rx="4" stroke-dasharray="5 4"/><path d="M1200 182 h17 v261 h-17"/>
  </g>
  <text x="1240" y="282" class="label">模型用量</text><text x="1240" y="317" class="label">不断增加</text>
  <circle cx="1122" cy="477" r="4" fill="#a542ff"/><circle cx="1122" cy="493" r="4" fill="#a542ff"/>
  <text x="1062" y="535" class="small">回报率 / 投资回报率</text><text x="1116" y="575" font-size="30" fill="#a542ff">？</text>
</svg>
