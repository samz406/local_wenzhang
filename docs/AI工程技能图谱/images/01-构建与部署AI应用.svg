<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
  <title id="title">AI 工程技能图谱：构建与部署 AI 应用</title>
  <desc id="desc">AI 工程包含四项顶层能力，本图高亮构建与部署 AI 应用，并列出六项子能力。</desc>
  <defs>
    <linearGradient id="box" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b9dcff"/><stop offset="1" stop-color="#8fbbe8"/></linearGradient>
    <style>
      .title{font:600 25px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif;fill:#111827}.root{font:700 24px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.label{font:500 16px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.small{font:500 15px Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}.box{fill:url(#box);stroke:#17364d;stroke-width:2}.active{stroke:#9b2c83;stroke-width:4}.line{fill:none;stroke:#225b73;stroke-width:2.5}.active-line{stroke:#9b2c83;stroke-width:3}
    </style>
  </defs>
  <rect width="1200" height="480" fill="#fff"/>
  <text class="title" x="600" y="42" text-anchor="middle">AI 工程技能图谱：构建与部署 AI 应用</text>
  <rect class="box" x="480" y="72" width="240" height="58" rx="10"/>
  <text class="root" x="600" y="108" text-anchor="middle">AI 工程</text>
  <path class="line" d="M600 130V160H195V185 M600 160H465V185 M600 160H735V185 M600 160H1005V185"/>
  <rect class="box active" x="85" y="185" width="220" height="62" rx="10"/>
  <rect class="box" x="355" y="185" width="220" height="62" rx="10"/>
  <rect class="box" x="625" y="185" width="220" height="62" rx="10"/>
  <rect class="box" x="895" y="185" width="220" height="62" rx="10"/>
  <text class="label" text-anchor="middle"><tspan x="195" y="211">构建与部署</tspan><tspan x="195" y="232">AI 应用</tspan></text>
  <text class="label" text-anchor="middle"><tspan x="465" y="211">软件工程</tspan><tspan x="465" y="232">基础</tspan></text>
  <text class="label" x="735" y="222" text-anchor="middle">使用编码智能体</text>
  <text class="label" x="1005" y="222" text-anchor="middle">塑造构建方向</text>
  <path class="line active-line" d="M195 247V302H125 M195 302H1075 M125 302V334 M315 302V334 M505 302V334 M695 302V334 M885 302V334 M1075 302V334"/>
  <rect class="box" x="45" y="334" width="160" height="72" rx="10"/>
  <rect class="box" x="235" y="334" width="160" height="72" rx="10"/>
  <rect class="box" x="425" y="334" width="160" height="72" rx="10"/>
  <rect class="box" x="615" y="334" width="160" height="72" rx="10"/>
  <rect class="box" x="805" y="334" width="160" height="72" rx="10"/>
  <rect class="box" x="995" y="334" width="160" height="72" rx="10"/>
  <text class="small" text-anchor="middle"><tspan x="125" y="363">大语言模型</tspan><tspan x="125" y="385">基础</tspan></text>
  <text class="small" text-anchor="middle"><tspan x="315" y="352">用数据为模型</tspan><tspan x="315" y="374">提供依据</tspan></text>
  <text class="small" text-anchor="middle"><tspan x="505" y="363">构建智能体</tspan><tspan x="505" y="385">系统</tspan></text>
  <text class="small" text-anchor="middle"><tspan x="695" y="363">以评估驱动</tspan><tspan x="695" y="385">开发</tspan></text>
  <text class="small" text-anchor="middle"><tspan x="885" y="363">生产环境</tspan><tspan x="885" y="385">运维</tspan></text>
  <text class="small" text-anchor="middle"><tspan x="1075" y="363">机器学习</tspan><tspan x="1075" y="385">基础</tspan></text>
</svg>
