<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 960" role="img" aria-labelledby="t d">
  <title id="t">Jev 在智能体循环中的位置</title><desc id="d">Jev 负责选模型、审批工具和验证结果</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6" fill="none" stroke="#202124" stroke-width="1.8"/></marker></defs>
  <style>.tx{font-family:'Noto Sans SC',sans-serif;fill:#202124}.h{font-size:34px;font-weight:700}.b{font-size:25px}.s{font-size:19px}.box{fill:#fff;stroke:#202124;stroke-width:3}.blue{fill:#dbe7fb}.green{fill:#d9f0df;stroke:#2f7d52}.purple{fill:#e8e0f7}</style>
  <rect width="1100" height="960" fill="#fbfaf7"/><text class="tx h" x="550" y="55" text-anchor="middle">Jev 在智能体循环中</text>
  <rect class="box blue" x="430" y="110" width="240" height="110" rx="18"/><text class="tx b" x="550" y="155" text-anchor="middle">上下文</text><text class="tx b" x="550" y="190" text-anchor="middle">+ 状态</text><circle cx="550" cy="90" r="25" fill="#fff4bf" stroke="#202124" stroke-width="3"/><text class="tx b" x="550" y="99" text-anchor="middle">1</text>
  <rect class="box green" x="775" y="275" width="250" height="110" rx="18"/><text class="tx b" x="900" y="320" text-anchor="middle">Jev</text><text class="tx b" x="900" y="355" text-anchor="middle">选择模型</text><circle cx="1035" cy="260" r="25" fill="#fff4bf" stroke="#202124" stroke-width="3"/><text class="tx b" x="1035" y="269" text-anchor="middle">2</text>
  <rect class="box purple" x="430" y="430" width="240" height="120" rx="18"/><text class="tx h" x="550" y="503" text-anchor="middle">LLM</text><circle cx="415" cy="425" r="25" fill="#fff4bf" stroke="#202124" stroke-width="3"/><text class="tx b" x="415" y="434" text-anchor="middle">3</text><text class="tx s" x="550" y="585" text-anchor="middle">不断循环，直到任务完成</text>
  <rect class="box" x="775" y="630" width="250" height="95" rx="18"/><text class="tx b" x="900" y="685" text-anchor="middle">工具调用</text><circle cx="1035" cy="740" r="25" fill="#fff4bf" stroke="#202124" stroke-width="3"/><text class="tx b" x="1035" y="749" text-anchor="middle">4</text>
  <rect class="box green" x="425" y="750" width="250" height="110" rx="18"/><text class="tx b" x="550" y="795" text-anchor="middle">Jev</text><text class="tx b" x="550" y="830" text-anchor="middle">批准工具</text><circle cx="550" cy="885" r="25" fill="#fff4bf" stroke="#202124" stroke-width="3"/><text class="tx b" x="550" y="894" text-anchor="middle">5</text>
  <rect class="box" x="75" y="630" width="250" height="95" rx="18"/><text class="tx b" x="200" y="685" text-anchor="middle">运行工具</text><circle cx="65" cy="740" r="25" fill="#fff4bf" stroke="#202124" stroke-width="3"/><text class="tx b" x="65" y="749" text-anchor="middle">6</text>
  <rect class="box green" x="75" y="275" width="250" height="110" rx="18"/><text class="tx b" x="200" y="320" text-anchor="middle">Jev</text><text class="tx b" x="200" y="355" text-anchor="middle">验证结果</text><circle cx="65" cy="260" r="25" fill="#fff4bf" stroke="#202124" stroke-width="3"/><text class="tx b" x="65" y="269" text-anchor="middle">7</text>
  <g fill="none" stroke="#202124" stroke-width="4" marker-end="url(#a)"><path d="M670 180L810 275"/><path d="M825 385L650 430"/><path d="M670 535L820 630"/><path d="M775 705L650 750"/><path d="M425 805L300 725"/><path d="M200 630V385"/><path d="M325 300L430 205"/></g>
  <text class="tx s" x="760" y="220" fill="#2f7d52">调用之前</text><text class="tx s" x="760" y="800" fill="#2f7d52">运行之前</text><text class="tx s" x="245" y="235" fill="#2f7d52">运行之后</text><text class="tx s" x="550" y="940" text-anchor="middle" fill="#2f7d52">绿色节点 = Jev 检查点；其余部分是普通智能体循环</text>
</svg>
