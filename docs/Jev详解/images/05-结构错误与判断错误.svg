<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 850" role="img" aria-labelledby="t d">
  <title id="t">结构错误与判断错误</title><desc id="d">类型安全能挡住结构错误，却挡不住合法但错误的判断</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6" fill="none" stroke="#202124" stroke-width="1.8"/></marker></defs>
  <style>.tx{font-family:'Noto Sans SC',sans-serif;fill:#303540}.h{font-size:31px;font-weight:700}.b{font-size:23px}.s{font-size:19px}.box{fill:#fff;stroke:#202124;stroke-width:3}.pink{fill:#f6dce5}.blue{fill:#dbe7fb}.red{fill:#b84252}.green{fill:#2f7d52}</style>
  <rect width="1500" height="850" fill="#fbfaf7"/><text class="tx h" x="35" y="60">类型安全能拦住一种错误，却对另一种无能为力。</text>
  <text class="tx h red" x="70" y="145">结构错误</text><text class="tx b" x="340" y="145">Schema 能排除的错误</text><rect class="box pink" x="85" y="185" width="240" height="75" rx="15"/><text class="tx h" x="205" y="233" text-anchor="middle">“法务”</text><text class="tx s red" x="85" y="295">不在选项列表中的答案</text><path d="M325 222H760" stroke="#b84252" stroke-width="4" stroke-dasharray="12 10" marker-end="url(#a)"/><text class="tx b red" x="590" y="205">已拦截，不会返回</text><circle cx="790" cy="222" r="30" fill="#fff" stroke="#b84252" stroke-width="5"/><path d="M770 244L810 200" stroke="#b84252" stroke-width="5"/>
  <text class="tx h red" x="70" y="485">判断错误</text><text class="tx b" x="340" y="485">Schema 看不见的错误</text><rect class="box blue" x="85" y="525" width="260" height="90" rx="15"/><text class="tx b" x="215" y="562" text-anchor="middle">登录故障</text><text class="tx s" x="215" y="595" text-anchor="middle">（其实是技术问题）</text>
  <rect class="box" x="820" y="160" width="290" height="590" rx="28"/><text class="tx h" x="965" y="215" text-anchor="middle">Jev 的 Schema</text><text class="tx s" x="965" y="250" text-anchor="middle">只存在这些答案</text><g class="tx b" text-anchor="middle"><rect class="box" x="865" y="300" width="200" height="62" rx="12"/><text x="965" y="340">账单</text><rect class="box" x="865" y="390" width="200" height="62" rx="12"/><text x="965" y="430">技术</text><rect class="box" x="865" y="480" width="200" height="62" rx="12"/><text x="965" y="520">销售</text></g>
  <path d="M345 570H820" stroke="#202124" stroke-width="4" marker-end="url(#a)"/><text class="tx b green" x="680" y="615">结构合法 ✓</text><path d="M1110 570H1190" stroke="#202124" stroke-width="4" marker-end="url(#a)"/><text class="tx b" x="1190" y="515">Jev 返回了一个合法标签……</text><rect class="box pink" x="1190" y="535" width="220" height="70" rx="14"/><text class="tx h" x="1300" y="580" text-anchor="middle">账单</text><text class="tx s red" x="1300" y="640" text-anchor="middle">本应是“技术”</text><path d="M1300 605V675" stroke="#b84252" stroke-width="4" marker-end="url(#a)"/><rect class="box pink" x="1160" y="675" width="290" height="70" rx="14"/><text class="tx b" x="1305" y="718" text-anchor="middle">给错客户退款</text>
</svg>
