<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" role="img" aria-labelledby="t d">
  <title id="t">Jev 并行回答多个问题</title><desc id="d">支持工单进入 Jev 后同时得到紧急程度、所属部门、严重性与退款判断，再由代码选择分支</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6" fill="none" stroke="#263238" stroke-width="1.8"/></marker></defs>
  <style>.tx{font-family:'Noto Sans SC',sans-serif;fill:#202124}.h{font-size:30px;font-weight:700}.b{font-size:23px}.s{font-size:19px}.box{fill:#fff;stroke:#263238;stroke-width:3}.blue{fill:#dbe7fb}.green{fill:#d9f0df}.code{fill:#202737}</style>
  <rect width="1600" height="700" fill="#fff"/>
  <text class="tx b" x="55" y="90">状态（输入）</text><rect class="box blue" x="50" y="115" width="340" height="360" rx="22"/><text class="tx h" x="80" y="165">支持工单</text><text class="tx b" x="80" y="215"><tspan x="80" dy="0">“部署失败了两次，</tspan><tspan x="80" dy="38">客户正在遇到 500 错误。</tspan><tspan x="80" dy="38">我们需要修复问题，</tspan><tspan x="80" dy="38">并补偿停机损失。”</tspan></text>
  <rect class="box green" x="455" y="225" width="180" height="150" rx="22"/><text class="tx h" x="545" y="315" text-anchor="middle">Jev</text><text class="tx s" x="545" y="415" text-anchor="middle">一次问完所有问题</text><path d="M390 295H455" stroke="#263238" stroke-width="4" marker-end="url(#a)"/>
  <text class="tx b" x="770" y="65" text-anchor="middle" fill="#2f7d52">并行评估</text>
  <g class="tx s"><rect class="box" x="700" y="90" width="300" height="65" rx="11"/><text x="850" y="130" text-anchor="middle">紧急 · Noul</text><rect class="box green" x="1035" y="90" width="170" height="65" rx="11"/><text x="1120" y="130" text-anchor="middle">是（0.94）</text>
  <rect class="box" x="700" y="190" width="300" height="65" rx="11"/><text x="850" y="230" text-anchor="middle">部门 · Choice</text><rect class="box green" x="1035" y="190" width="170" height="65" rx="11"/><text x="1120" y="230" text-anchor="middle">工程</text>
  <rect class="box" x="700" y="290" width="300" height="65" rx="11"/><text x="850" y="330" text-anchor="middle">严重性 · Score</text><rect class="box green" x="1035" y="290" width="170" height="65" rx="11"/><text x="1120" y="330" text-anchor="middle">高</text>
  <rect class="box" x="700" y="390" width="300" height="65" rx="11"/><text x="850" y="430" text-anchor="middle">申请退款 · Noul</text><rect class="box green" x="1035" y="390" width="170" height="65" rx="11"/><text x="1120" y="430" text-anchor="middle">否（0.06）</text></g>
  <g fill="none" stroke="#2f7d52" stroke-width="3" marker-end="url(#a)"><path d="M635 285L700 123"/><path d="M635 295L700 223"/><path d="M635 305L700 323"/><path d="M635 315L700 423"/></g><g fill="none" stroke="#263238" stroke-width="3" marker-end="url(#a)"><path d="M1000 123H1035"/><path d="M1000 223H1035"/><path d="M1000 323H1035"/><path d="M1000 423H1035"/></g>
  <text class="tx b" x="1340" y="90" text-anchor="middle">代码（选择分支）</text><rect class="code" x="1250" y="120" width="300" height="145" rx="14"/><text x="1280" y="165" font-family="monospace" font-size="20" fill="#fff">if urgent and</text><text x="1280" y="198" font-family="monospace" font-size="20" fill="#fff">owner == "engineering":</text><text x="1310" y="232" font-family="monospace" font-size="20" fill="#8ee5aa">page_on_call()</text>
  <path d="M1205 123L1250 170M1205 223L1250 185M1205 323L1250 200M1205 423L1250 215" fill="none" stroke="#263238" stroke-width="3" marker-end="url(#a)"/><rect class="box blue" x="1295" y="345" width="230" height="70" rx="12"/><text class="tx h" x="1410" y="390" text-anchor="middle">呼叫值班人员</text><path d="M1400 265V345" stroke="#3867a9" stroke-width="4" marker-end="url(#a)"/><text class="tx b" x="1405" y="470" text-anchor="middle" fill="#3867a9">执行动作的是代码，不是模型</text>
</svg>
