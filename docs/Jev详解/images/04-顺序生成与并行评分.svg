<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 900" role="img" aria-labelledby="t d">
  <title id="t">顺序生成与并行评分</title><desc id="d">传统 LLM 逐个输出词元，Jev 一次完成所有判断</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6" fill="none" stroke="#202124" stroke-width="1.8"/></marker></defs>
  <style>.tx{font-family:'Noto Sans SC',sans-serif;fill:#202124}.h{font-size:34px;font-weight:700}.b{font-size:26px}.s{font-size:21px}.box{fill:#fff;stroke:#202124;stroke-width:3}.llm{fill:#e8e0f7}.jev{fill:#d9f0df}.green{fill:#2f7d52}.purple{fill:#6848c4}</style>
  <rect width="1500" height="900" fill="#fff"/>
  <text class="tx h purple" x="270" y="70" text-anchor="middle">逐个输出词元</text><rect class="box llm" x="80" y="110" width="380" height="90" rx="18"/><text class="tx h" x="270" y="165" text-anchor="middle">通用 LLM</text>
  <g class="tx b" text-anchor="middle"><rect class="box llm" x="120" y="270" width="300" height="58" rx="10"/><text x="270" y="307">{</text><rect class="box llm" x="120" y="350" width="300" height="58" rx="10"/><text x="270" y="387">"urgent":</text><rect class="box llm" x="120" y="430" width="300" height="58" rx="10"/><text x="270" y="467">true,</text><rect class="box llm" x="120" y="510" width="300" height="58" rx="10"/><text x="270" y="547">"team":</text><rect class="box llm" x="120" y="590" width="300" height="58" rx="10"/><text x="270" y="627">"eng"</text><rect class="box llm" x="120" y="670" width="300" height="58" rx="10"/><text x="270" y="707">}</text></g>
  <g stroke="#202124" stroke-width="3" marker-end="url(#a)"><path d="M270 328V350"/><path d="M270 408V430"/><path d="M270 488V510"/><path d="M270 568V590"/><path d="M270 648V670"/></g>
  <text class="tx h green" x="1080" y="70" text-anchor="middle">一次完成所有评分</text><rect class="box jev" x="890" y="110" width="380" height="90" rx="18"/><text class="tx h" x="1080" y="165" text-anchor="middle">Jev</text>
  <g class="tx b"><text x="760" y="335">紧急</text><rect class="box" x="880" y="300" width="380" height="52" rx="18"/><rect class="jev" x="883" y="303" width="355" height="46" rx="15"/><text class="green" x="1280" y="335">0.94</text><text x="720" y="455">团队 = 工程</text><rect class="box" x="880" y="420" width="380" height="52" rx="18"/><rect class="jev" x="883" y="423" width="330" height="46" rx="15"/><text class="green" x="1280" y="455">0.88</text><text x="760" y="575">退款</text><rect class="box" x="880" y="540" width="380" height="52" rx="18"/><rect class="jev" x="883" y="543" width="25" height="46" rx="15"/><text class="green" x="1280" y="575">0.06</text></g>
  <rect class="box" x="500" y="780" width="500" height="75" rx="18"/><text class="tx h" x="750" y="828" text-anchor="middle">进入同一段代码分支</text><path d="M270 728L620 780M1080 592L880 780" fill="none" stroke="#202124" stroke-width="4" marker-end="url(#a)"/><text class="tx s" x="750" y="885" text-anchor="middle" fill="#646a78">输出看起来可以相同，但计算方式完全不同</text>
</svg>
