<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650">
  <rect width="1200" height="650" fill="#edf0f3"/><rect x="20" y="20" width="1160" height="610" rx="10" fill="#fff" stroke="#c9ced4"/><style>text{font-family:Arial,'Noto Sans SC',sans-serif}.h{font-size:23px;font-weight:700;fill:#1c2025}.t{font-size:15px;fill:#282d33}.s{font-size:13px;fill:#687078}.code{font-family:Consolas,monospace;font-size:14px;fill:#d7e1ee}</style>
  <rect x="20" y="20" width="1160" height="58" rx="10" fill="#12161a"/><text x="48" y="56" fill="#fff" font-size="21" font-weight="700" font-family="Arial,'Noto Sans SC',sans-serif">MCP Gateway　/　logging-mcp</text>
  <rect x="20" y="78" width="245" height="552" fill="#f5f6f7"/><text x="46" y="120" class="h">工具</text><rect x="42" y="142" width="200" height="38" rx="5" fill="#fff" stroke="#bbb"/><text x="55" y="166" class="s">搜索工具……</text>
  <rect x="38" y="200" width="210" height="56" rx="6" fill="#e9dcff"/><text x="52" y="224" class="t">query_logs</text><text x="52" y="244" class="s">查询日志</text><text x="52" y="292" class="t">get_log_context</text><text x="52" y="312" class="s">获取日志上下文</text><text x="52" y="360" class="t">list_sources</text><text x="52" y="380" class="s">列出日志源</text>
  <text x="305" y="120" class="h">query_logs</text><text x="305" y="150" class="s">在指定时间范围内检索并筛选服务日志</text><rect x="1010" y="100" width="130" height="40" rx="6" fill="#111"/><text x="1075" y="126" fill="#fff" font-size="15" text-anchor="middle" font-family="Arial,'Noto Sans SC',sans-serif">保存变更</text>
  <text x="305" y="200" class="t" font-weight="700">工具描述</text><rect x="305" y="216" width="835" height="62" rx="6" fill="#fff" stroke="#bdc3c9"/><text x="322" y="243" class="t">根据服务、关键字和时间窗口查询日志，并返回匹配记录。</text><text x="322" y="264" class="s">所有描述变更均需由服务器所有者批准。</text>
  <text x="305" y="320" class="t" font-weight="700">输入模式（JSON Schema）</text><rect x="305" y="338" width="835" height="250" rx="7" fill="#18212b"/>
  <g class="code"><text x="330" y="370">{</text><text x="350" y="398">"type": "object",</text><text x="350" y="426">"properties": {</text><text x="375" y="454">"service": { "type": "string", "description": "服务名称" },</text><text x="375" y="482">"query": { "type": "string", "description": "日志查询条件" },</text><text x="375" y="510">"start_time": { "type": "string", "description": "开始时间" },</text><text x="375" y="538">"fields": { "type": "array", "description": "需要返回的字段" }</text><text x="350" y="566">}</text><text x="330" y="584">}</text></g>
</svg>
