<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <defs><marker id="a5" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6Z" fill="#626a73"/></marker></defs><rect width="1200" height="760" fill="#fff"/><style>text{font-family:Arial,'Noto Sans SC',sans-serif}.h{font-size:24px;font-weight:700}.t{font-size:17px}.s{font-size:14px;fill:#555}.layer{stroke:#41474d;stroke-width:2}.line{stroke:#626a73;stroke-width:3;fill:none;marker-end:url(#a5)}</style>
  <text x="600" y="45" text-anchor="middle" class="h">MCP Gateway 数据平面</text>
  <rect x="80" y="75" width="1040" height="78" rx="12" fill="#f1e7ff" class="layer"/><text x="125" y="108" class="h">1　调用方</text><text x="360" y="108" class="t">人类　·　服务　·　AI 智能体　·　编码智能体</text><text x="360" y="135" class="s">通过 /&lt;service-name&gt;/mcp 统一端点调用</text>
  <rect x="80" y="175" width="1040" height="78" rx="12" fill="#e8f1ff" class="layer"/><text x="125" y="208" class="h">2　接入层</text><text x="360" y="208" class="t">认证　·　限流　·　请求校验　·　可观测性</text><text x="360" y="235" class="s">识别调用主体并建立请求上下文</text>
  <rect x="80" y="275" width="1040" height="78" rx="12" fill="#e8f8f2" class="layer"/><text x="125" y="308" class="h">3　安全中间件</text><text x="360" y="308" class="t">Charter 授权策略　·　工具级权限　·　PII / 敏感数据脱敏</text><text x="360" y="335" class="s">服务器级策略可由工具级规则覆盖</text>
  <rect x="80" y="375" width="1040" height="78" rx="12" fill="#fff4d9" class="layer"/><text x="125" y="408" class="h">4　代理与路由</text><text x="360" y="408" class="t">虚拟 MCP 服务器　·　服务器处理器　·　工具映射</text><text x="360" y="435" class="s">从内存配置解析目标服务器和工具</text>
  <rect x="80" y="475" width="1040" height="78" rx="12" fill="#ffe9e5" class="layer"/><text x="125" y="508" class="h">5　协议执行</text><text x="360" y="508" class="t">JSON ↔ Protobuf / Thrift　·　HTTP / gRPC / TChannel　·　原生 MCP</text><text x="360" y="535" class="s">经 Muttley 服务网格边车执行下游请求</text>
  <rect x="80" y="575" width="1040" height="78" rx="12" fill="#eef0f2" class="layer"/><text x="125" y="608" class="h">6　下游服务</text><text x="360" y="608" class="t">现有后端 API　·　内部微服务　·　原生 MCP 服务器</text><text x="360" y="635" class="s">无需修改现有服务实现</text>
  <g class="line"><path d="M600 153V175"/><path d="M600 253V275"/><path d="M600 353V375"/><path d="M600 453V475"/><path d="M600 553V575"/></g>
  <text x="600" y="708" text-anchor="middle" class="t" font-weight="700">服务器和工具配置由控制平面持续同步，内存状态按固定周期刷新</text>
</svg>
