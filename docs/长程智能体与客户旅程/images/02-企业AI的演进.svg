</text>
<polygon points="200,155 480,155 525,330 480,536 200,536 200,330" fill="#e4eef0"/>
<polygon points="480,155 800,155 845,330 800,536 480,536 525,330" fill="#bbd2d9"/>
<polygon points="800,155 1120,155 1155,330 1120,536 800,536 845,330" fill="#89b2bf"/>
