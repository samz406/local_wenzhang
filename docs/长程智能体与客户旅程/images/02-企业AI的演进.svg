<tspan x="238" dy="0">AI 助手</tspan>
</text>
<text x="238" y="248" font-size="23" fill="#082740" text-anchor="start" font-weight="400">
<tspan x="238" dy="0">负责一项任务</tspan>
</text>
<text x="238" y="287" font-size="16" fill="#082740" text-anchor="start" font-weight="400">
<tspan x="238" dy="0">“发出这封跟进邮件”</tspan>
</text>
<text x="548" y="207" font-size="25" fill="#082740" text-anchor="start" font-weight="700">
<tspan x="548" dy="0">智能体</tspan>
</text>
