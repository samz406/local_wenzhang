<tspan x="548" dy="0">负责一次交互</tspan>
</text>
<text x="548" y="287" font-size="16" fill="#082740" text-anchor="start" font-weight="400">
<tspan x="548" dy="0">“处理这位客户的退款来电”</tspan>
</text>
<text x="858" y="207" font-size="25" fill="#082740" text-anchor="start" font-weight="700">
<tspan x="858" dy="0">长期运行的智能体</tspan>
</text>
<text x="858" y="248" font-size="23" fill="#082740" text-anchor="start" font-weight="400">
<tspan x="858" dy="0">负责最终结果</tspan>
</text>
<text x="858" y="287" font-size="16" fill="#082740" text-anchor="start" font-weight="400">
<tspan x="858" dy="0">“让这位客户获得尽可能多的赔偿”</tspan>
</text>
<rect x="48" y="397" width="1100" height="68" rx="0" fill="#ffffff" opacity=".30"/>
