<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560"><rect width="1200" height="560" fill="#fff"/><style>text{font-family:Arial,'Noto Sans SC',sans-serif}.h{font-size:27px;font-weight:700}.t{font-size:17px}.s{font-size:14px;fill:#555}.b{stroke:#333;stroke-width:2}</style><text x="600" y="45" class="h" text-anchor="middle">访问同一批 MCP 工具时，会话一开始已经携带多少内容？</text>
 <rect x="80" y="110" width="300" height="310" rx="18" fill="#ffe6e1" class="b"/><text x="230" y="155" class="h" text-anchor="middle">逐台安装服务器</text><rect x="130" y="205" width="200" height="145" fill="#e35d47"/><text x="230" y="270" fill="#fff" font-size="34" font-weight="700" text-anchor="middle" font-family="Arial,sans-serif">50K–70K</text><text x="230" y="310" fill="#fff" font-size="18" text-anchor="middle" font-family="Arial,'Noto Sans SC',sans-serif">模式令牌</text><text x="230" y="390" class="t" text-anchor="middle">每一轮都重新发送</text>
 <rect x="450" y="110" width="300" height="310" rx="18" fill="#fff3d9" class="b"/><text x="600" y="155" class="h" text-anchor="middle">工具搜索</text><rect x="500" y="310" width="200" height="40" fill="#e6a33f"/><text x="600" y="240" class="h" text-anchor="middle">按需加载</text><text x="600" y="277" class="t" text-anchor="middle">只注入选中的工具</text><text x="600" y="390" class="t" text-anchor="middle">令牌开销大幅下降</text>
 <rect x="820" y="110" width="300" height="310" rx="18" fill="#e5f4e9" class="b"/><text x="970" y="155" class="h" text-anchor="middle">CLI + Gateway</text><rect x="870" y="338" width="200" height="12" fill="#4ba56a"/><text x="970" y="240" class="h" text-anchor="middle">接近 0</text><text x="970" y="277" class="t" text-anchor="middle">调用时动态解析</text><text x="970" y="390" class="t" text-anchor="middle">1000+ 工具不进入上下文</text><text x="600" y="500" class="s" text-anchor="middle">超过 100 个已安装工具时，标准 MCP 会给初始提示词额外增加约 5 万至 7 万个模式令牌</text></svg>
