<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600"><defs><marker id="a9" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6Z" fill="#555"/></marker></defs><rect width="1200" height="600" fill="#fff"/><style>text{font-family:Arial,'Noto Sans SC',sans-serif}.h{font-size:27px;font-weight:700}.t{font-size:17px}.s{font-size:14px;fill:#555}.b{fill:#fafafa;stroke:#333;stroke-width:2}.l{stroke:#555;stroke-width:3;fill:none;marker-end:url(#a9)}</style><text x="600" y="45" class="h" text-anchor="middle">统一的 SaaS MCP 访问路径</text><rect x="60" y="220" width="220" height="110" rx="16" class="b"/><text x="170" y="260" class="h" text-anchor="middle">任意智能体界面</text><text x="170" y="295" class="s" text-anchor="middle">一条 Shell 命令 / 专用技能</text><rect x="410" y="175" width="300" height="200" rx="22" fill="#e9e0ff" stroke="#6f47ad" stroke-width="3"/><text x="560" y="225" class="h" text-anchor="middle">MCP Gateway</text><text x="560" y="265" class="t" text-anchor="middle">统一认证与策略</text><text x="560" y="300" class="t" text-anchor="middle">CLI 工具解析</text><text x="560" y="335" class="t" text-anchor="middle">按需加载，无模式膨胀</text><path d="M280 275H410" class="l"/>
