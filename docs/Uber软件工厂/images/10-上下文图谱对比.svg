 <rect x="730" y="130" width="490" height="90" rx="15" fill="#fff0ed" stroke="#9d5145" stroke-width="2"/><text x="975" y="165" class="t" text-anchor="middle">看不到目标数据表</text><text x="975" y="195" class="s" text-anchor="middle">只能从服务代码开始盲目搜索</text><rect x="730" y="260" width="490" height="125" rx="15" class="b"/><text x="975" y="298" class="t" text-anchor="middle">检查服务代码</text><text x="975" y="330" class="t" text-anchor="middle">启动 2 个子智能体</text><text x="975" y="362" class="t" text-anchor="middle">遭遇 3 次错误</text><rect x="730" y="430" width="490" height="110" rx="15" fill="#ffe4df" stroke="#9d5145" stroke-width="2"/><text x="975" y="472" class="h" text-anchor="middle">20 分 09 秒</text><text x="975" y="512" class="t" text-anchor="middle">错误结论：“数据集无法查询”</text><g class="l"><path d="M975 220V260"/><path d="M975 385V430"/></g><text x="650" y="625" class="t" text-anchor="middle" font-weight="700">更丰富的先验上下文，是减少搜索轮次最有力的单一杠杆</text><text x="650" y="660" class="s" text-anchor="middle">Uber AI Context Graph 覆盖 86 种节点类型和 117 种边类型</text></svg>
