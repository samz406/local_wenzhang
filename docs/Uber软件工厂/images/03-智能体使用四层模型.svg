<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
 <defs><marker id="a3" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6Z" fill="#555"/></marker></defs><rect width="1200" height="800" fill="#fff"/><style>text{font-family:Arial,'Noto Sans SC',sans-serif}.h{font-size:27px;font-weight:700}.t{font-size:18px}.s{font-size:14px;fill:#555}.box{stroke:#333;stroke-width:2}</style><text x="600" y="42" class="h" text-anchor="middle">软件工厂中的智能体使用层级</text>
 <rect x="80" y="95" width="1040" height="130" rx="16" fill="#dfeaff" class="box"/><text x="115" y="135" class="h">第 4 层　托管后台智能体</text><text x="115" y="170" class="t">自主运行 / 事件驱动</text><text x="420" y="135" class="t">AI PR 审查 · CI 自愈 · 缺陷分流 · 依赖迁移</text><text x="420" y="173" class="s">控制力最高：专用基准、模型路由、执行框架和成果成本</text>
 <rect x="80" y="245" width="1040" height="130" rx="16" fill="#e5f4e9" class="box"/><text x="115" y="285" class="h">第 3 层　计划与执行型智能体</text><text x="115" y="320" class="t">多步任务 / 人工审查</text><text x="420" y="285" class="t">端到端 PR · 调试 · 代码维护 · 视觉验证</text><text x="420" y="323" class="s">主模型拆解与评估，子智能体执行明确任务</text>
 <rect x="80" y="395" width="1040" height="130" rx="16" fill="#fff0d5" class="box"/><text x="115" y="435" class="h">第 2 层　技能与工作流</text><text x="115" y="470" class="t">可复用的任务封装</text><text x="420" y="435" class="t">3600+ 智能体技能 · 每日 3 万+ 次执行</text><text x="420" y="473" class="s">把常见工程流程固化成高效、可度量的路径</text>
 <rect x="80" y="545" width="1040" height="130" rx="16" fill="#f3e7ff" class="box"/><text x="115" y="585" class="h">第 1 层　交互式开发工具</text><text x="115" y="620" class="t">工程师发起 / 通用会话</text><text x="420" y="585" class="t">终端助手 · IDE 助手 · 通用聊天界面</text><text x="420" y="623" class="s">最灵活，但最难统一控制每场会话的行为</text>
 <path d="M1150 650V130" stroke="#555" stroke-width="4" marker-end="url(#a3)"/><text x="1176" y="390" class="t" transform="rotate(-90 1176 390)" text-anchor="middle">成本、质量与模型选择的控制力增强</text><text x="600" y="750" class="s" text-anchor="middle">层级越高，工作越专用，也越容易围绕成果进行治理与优化</text>
</svg>
