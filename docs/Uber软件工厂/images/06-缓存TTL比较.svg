<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660"><rect width="1200" height="660" fill="#fff"/><style>text{font-family:Arial,'Noto Sans SC',sans-serif}.h{font-size:27px;font-weight:700}.t{font-size:17px}.s{font-size:14px;fill:#555}.box{stroke:#3d444b;stroke-width:2}</style><text x="600" y="42" class="h" text-anchor="middle">5 分钟与 1 小时提示词缓存 TTL：5 轮会话成本比较</text>
 <text x="300" y="90" class="h" text-anchor="middle">主线程：轮次间隔较长</text><text x="900" y="90" class="h" text-anchor="middle">子智能体：短时连续执行</text>
 <g class="box"><rect x="70" y="130" width="460" height="170" rx="14" fill="#fff0e1"/><rect x="670" y="130" width="460" height="170" rx="14" fill="#e5f4e9"/></g><text x="100" y="170" class="t">5 分钟 TTL</text><text x="100" y="208" class="t">频繁过期 → 全价重建前缀</text><g><rect x="100" y="240" width="70" height="35" fill="#e46d4c"/><rect x="180" y="240" width="70" height="35" fill="#e46d4c"/><rect x="260" y="240" width="70" height="35" fill="#e46d4c"/><rect x="340" y="240" width="70" height="35" fill="#e46d4c"/><rect x="420" y="240" width="70" height="35" fill="#e46d4c"/></g><text x="700" y="170" class="t">5 分钟 TTL</text><text x="700" y="208" class="t">任务生命周期短 → 缓存始终有效</text><g><rect x="700" y="240" width="70" height="35" fill="#e46d4c"/><rect x="780" y="250" width="70" height="25" fill="#4ba56a"/><rect x="860" y="250" width="70" height="25" fill="#4ba56a"/><rect x="940" y="250" width="70" height="25" fill="#4ba56a"/><rect x="1020" y="250" width="70" height="25" fill="#4ba56a"/></g>
 <g class="box"><rect x="70" y="345" width="460" height="170" rx="14" fill="#e5f4e9"/><rect x="670" y="345" width="460" height="170" rx="14" fill="#fff0e1"/></g><text x="100" y="385" class="t">1 小时 TTL</text><text x="100" y="423" class="t">写入较贵，但后续读取仅为 0.1×</text><g><rect x="100" y="455" width="70" height="35" fill="#e46d4c"/><rect x="180" y="465" width="70" height="25" fill="#4ba56a"/><rect x="260" y="465" width="70" height="25" fill="#4ba56a"/><rect x="340" y="465" width="70" height="25" fill="#4ba56a"/><rect x="420" y="465" width="70" height="25" fill="#4ba56a"/></g><text x="700" y="385" class="t">1 小时 TTL</text><text x="700" y="423" class="t">对短任务写入溢价不划算</text><g><rect x="700" y="455" width="70" height="35" fill="#e46d4c"/><rect x="780" y="465" width="70" height="25" fill="#4ba56a"/><rect x="860" y="465" width="70" height="25" fill="#4ba56a"/><rect x="940" y="465" width="70" height="25" fill="#4ba56a"/><rect x="1020" y="465" width="70" height="25" fill="#4ba56a"/></g><text x="300" y="555" class="t" text-anchor="middle" font-weight="700">Uber 默认：主线程使用 1 小时 TTL</text><text x="900" y="555" class="t" text-anchor="middle" font-weight="700">Uber 默认：子智能体保留 5 分钟 TTL</text><g class="s"><rect x="390" y="600" width="22" height="15" fill="#e46d4c"/><text x="420" y="613">缓存写入 / 全价重建</text><rect x="640" y="600" width="22" height="15" fill="#4ba56a"/><text x="670" y="613">缓存读取</text></g></svg>
