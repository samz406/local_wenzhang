<svg xmlns="http://www.w3.org/2000/svg" width="920" height="760" viewBox="0 0 920 760" role="img" aria-labelledby="title desc">
  <title id="title">MCP 互操作层</title>
  <desc id="desc">Agent Harness 通过 MCP 客户端连接 MCP 服务器，服务器暴露工具、资源和提示词；可选扩展还能增加异步 Tasks 等协议能力。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,3 L0,6 Z" fill="#334155"/></marker>
    <style>.box{fill:#f8fafc;stroke:#64748b;stroke-width:2;rx:12}.accent{fill:#e0f2fe;stroke:#0284c7}.text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;font-size:24px;fill:#0f172a;text-anchor:middle}.small{font-size:19px;fill:#475569}.line{fill:none;stroke:#334155;stroke-width:2.5;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="920" height="760" fill="#fff"/>
  <rect class="box" x="280" y="45" width="360" height="75"/><text class="text" x="460" y="92">Agent Harness</text>
  <rect class="box accent" x="280" y="175" width="360" height="75"/><text class="text" x="460" y="222">MCP 客户端</text>
  <rect class="box accent" x="280" y="305" width="360" height="75"/><text class="text" x="460" y="352">MCP 服务器</text>
  <path class="line" d="M460 120V175"/><path class="line" d="M460 250V305"/>
  <rect class="box" x="75" y="495" width="220" height="75"/><text class="text" x="185" y="542">工具</text>
  <rect class="box" x="350" y="495" width="220" height="75"/><text class="text" x="460" y="542">资源</text>
  <rect class="box" x="625" y="495" width="220" height="75"/><text class="text" x="735" y="542">提示词</text>
  <path class="line" d="M460 380V430H185V495"/><path class="line" d="M460 380V495"/><path class="line" d="M460 430H735V495"/>
  <text class="text small" x="460" y="655">可选扩展还可增加其他协议能力，例如异步 Tasks。</text>
</svg>
